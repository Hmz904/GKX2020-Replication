# Generated by scripts/build_public_panel.py -- do not hand-edit the feature block.
# Public-data subsample: 600 permnos, 199501 to 201512.
# The target is reconstructed from mom1m and is NOT the CRSP return used by GKX.
run_name: gkx_calib600
seed: 20260905
# Windows: joblib silently deadlocks when tuning_n_jobs > 1 (9h, no traceback). Keep at 1.
tuning_n_jobs: 1

checkpoint:
  resume: true

data:
  path: data/processed/subsample_calib600.parquet
  date_col: date
  id_col: permno
  target_col: ret_excess
  market_cap_col: mve
  return_col: ret
  min_valid_market_cap_fraction: 0.01
  file_glob: "**/*"
  downcast_float32: true

features:
  mode: interact
  characteristic_columns:
    - mvel1
    - beta
    - betasq
    - chmom
    - dolvol
    - idiovol
    - indmom
    - mom1m
    - mom6m
    - mom12m
    - mom36m
    - pricedelay
    - turn
    - absacc
    - acc
    - age
    - agr
    - bm
    - bm_ia
    - cashdebt
    - cashpr
    - cfp
    - cfp_ia
    - chatoia
    - chcsho
    - chempia
    - chinv
    - chpmia
    - convind
    - currat
    - depr
    - divi
    - divo
    - dy
    - egr
    - ep
    - gma
    - grcapx
    - grltnoa
    - herf
    - hire
    - invest
    - lev
    - lgr
    - mve_ia
    - operprof
    - orgcap
    - pchcapx_ia
    - pchcurrat
    - pchdepr
    - pchgm_pchsale
    - pchquick
    - pchsale_pchinvt
    - pchsale_pchrect
    - pchsale_pchxsga
    - pchsaleinv
    - pctacc
    - ps
    - quick
    - rd
    - rd_mve
    - rd_sale
    - realestate
    - roic
    - salecash
    - saleinv
    - salerec
    - secured
    - securedind
    - sgr
    - sin
    - sp
    - tang
    - tb
    - aeavol
    - cash
    - chtx
    - cinvest
    - ear
    - nincr
    - roaq
    - roavol
    - roeq
    - rsup
    - stdacc
    - stdcf
    - ms
    - baspread
    - ill
    - maxret
    - retvol
    - std_dolvol
    - std_turn
    - zerotrade
  macro_columns: [macro_dp, macro_ep, macro_bm, macro_ntis, macro_tbl, macro_tms, macro_dfy, macro_svar]
  industry_code_col: sic2
  industry_values: null
  expected_num_characteristics: 94
  expected_num_macros: 8
  expected_num_industries: 59
  expected_num_features: 905
  fill_missing_monthly_median: true
  drop_missing_industry: true

split:
  train_start: 1995-01-01
  initial_train_end: 2005-12-31
  initial_validation_start: 2006-01-01
  initial_validation_end: 2010-12-31
  test_start: 2015-01-01
  test_end: 2015-12-31
  refit_frequency: yearly

models:
  names: [ols, ols3, enet_huber, pcr, pls, glm, rf, gbrt_huber, nn1, nn2, nn3, nn4, nn5]
  # eta0 lowered from the 1e-3 default: on real characteristic distributions that
  # step size diverges at small sklearn_alpha (FINDINGS.md section 1).
  ols_huber_quantile: 0.999
  ols_eta0: 0.0001
  ols_max_iter: 5000
  ols3_features: [mvel1, bm, mom12m]
  ols3_huber_quantile: 0.999
  ols3_eta0: 0.0001
  ols3_max_iter: 5000
  enet_huber:
    sklearn_alpha: [0.0000001, 0.000001, 0.00001, 0.0001, 0.001, 0.01]
    paper_rho: 0.5
    huber_quantile: 0.999
    eta0: 0.0001
    max_iter: 5000
  pcr:
    n_components: [5, 10, 20, 30, 40, 50]
  pls:
    n_components: [1, 2, 3, 5, 10]
  glm:
    n_knots: 3
    transform_batch_size: 4096
    streaming_epochs: 5
    sklearn_alpha: [0.0000001, 0.000001, 0.00001, 0.0001, 0.001, 0.01]
    paper_rho: 0.5
    huber_quantile: 0.999
    eta0: 0.0001
  rf:
    n_estimators: 300
    max_depth: [1, 2, 3, 4, 5, 6]
    max_features: [3, 5, 10, 20, 30, 50]
    min_samples_leaf: 1
    forest_n_jobs: -1
  gbrt_huber:
    n_estimators: [1, 10, 50, 100, 300, 500, 1000]
    learning_rate: [0.01, 0.1]
    max_depth: [1, 2]
    min_samples_leaf: 1
    huber_quantile: 0.999
  neural_net:
    epochs: 100
    batch_size: 10000
    inference_batch_size: 65536
    learning_rate: [0.001, 0.01]
    l1_lambda: [0.00001, 0.0001, 0.001]
    patience: 5
    output_init_scale: 0.01
    # Cut from the paper's 10 seeds to bound runtime on one machine.
    seeds: [1, 2, 3]
    device: auto

evaluation:
  top_bottom_n: 1000
  annualization: 12
  portfolio_bins: 10
  newey_west_lags: 6
  save_predictions: true
